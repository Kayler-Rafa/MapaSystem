<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<title>Painel de Sistemas</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-painel-32.png">
<link rel="apple-touch-icon" href="/icons/icon-painel-180.png">
<link rel="manifest" href="/painel.webmanifest">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0e0f11; --plate:#1b1d21; --plate-edge:#2a2d33; --fg:#eceef1; --muted:#8b9099;
    --amber:#f5b400; --red:#d42a2a; --red-hi:#ff4d4d; --red-lo:#8f1414;
    --green:#1f9d4c; --green-hi:#3ddc78; --green-lo:#0f5c2b;
  }
  body{
    font-family:"Arial Narrow",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--fg);
    min-height:100vh;padding:calc(24px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    background-image:radial-gradient(circle at 50% -10%,#1d2026 0,transparent 60%);
  }
  .wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  header{display:flex;align-items:center;gap:12px}
  header img{width:44px;height:44px;border-radius:11px}
  h1{font-size:22px;letter-spacing:.02em}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}

  .senha{display:flex;align-items:center;gap:10px;background:var(--plate);border:1px solid var(--plate-edge);border-radius:12px;padding:10px 14px}
  .senha label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;white-space:nowrap}
  .senha input{flex:1;min-width:0;background:transparent;border:none;color:var(--fg);font-size:20px;letter-spacing:.4em;outline:none;font-family:inherit}

  /* Caixa de controle de cada projeto */
  .caixa{
    background:linear-gradient(#202328,#17191d);border:1px solid var(--plate-edge);border-radius:18px;
    padding:18px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);position:relative;
  }
  .parafuso{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6b7078,#2b2e33);}
  .parafuso::after{content:"";position:absolute;left:2px;right:2px;top:4px;height:2px;background:#1a1c20;transform:rotate(35deg)}
  .p1{top:10px;left:10px}.p2{top:10px;right:10px}.p3{bottom:10px;left:10px}.p4{bottom:10px;right:10px}
  .placa{position:relative;z-index:3;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 10px}
  .nome{font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .url{font-size:11px;color:var(--muted);letter-spacing:.04em}
  .led{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;color:var(--muted)}
  .led i{width:11px;height:11px;border-radius:50%;background:#3a3d43;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
  .led.on{color:var(--green-hi)}.led.on i{background:var(--green-hi);box-shadow:0 0 10px var(--green-hi)}
  .led.off{color:var(--amber)}.led.off i{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pisca 1.4s infinite}
  @keyframes pisca{50%{opacity:.35}}

  /* Base listrada + botão + tampa */
  .base{
    --tam:190px;width:var(--tam);height:var(--tam);border-radius:50%;position:relative;
    background:repeating-linear-gradient(45deg,var(--amber) 0 14px,#111 14px 28px);
    display:flex;align-items:center;justify-content:center;perspective:700px;
    box-shadow:0 6px 18px rgba(0,0,0,.6);
  }
  .anel{width:82%;height:82%;border-radius:50%;background:#15171a;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 4px 10px rgba(0,0,0,.8)}
  .botao{
    width:84%;height:84%;border-radius:50%;border:none;cursor:pointer;position:relative;
    background:radial-gradient(circle at 38% 30%,var(--hi) 0,var(--cor) 45%,var(--lo) 100%);
    box-shadow:0 10px 0 var(--lo),0 14px 20px rgba(0,0,0,.6),inset 0 -6px 12px rgba(0,0,0,.35);
    transform:translateY(-6px);transition:transform .08s,box-shadow .08s;
    color:#fff;font-family:inherit;font-weight:700;letter-spacing:.14em;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  .botao.vermelho{--cor:var(--red);--hi:var(--red-hi);--lo:var(--red-lo)}
  .botao.verde{--cor:var(--green);--hi:var(--green-hi);--lo:var(--green-lo)}
  .botao:active,.botao.apertado{transform:translateY(4px);box-shadow:0 0 0 var(--lo),0 4px 8px rgba(0,0,0,.6),inset 0 -4px 10px rgba(0,0,0,.4)}
  .botao:disabled{cursor:default}
  .botao svg{display:block;margin:0 auto 4px;width:34px;height:34px}

  .tampa{
    position:absolute;inset:-4%;border-radius:50%;cursor:pointer;z-index:2;
    background:linear-gradient(160deg,rgba(255,255,255,.32),rgba(255,255,255,.08) 45%,rgba(255,255,255,.18));
    border:2px solid rgba(255,255,255,.35);
    box-shadow:inset 0 0 18px rgba(255,255,255,.15),0 8px 18px rgba(0,0,0,.35);
    backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);
    transform-origin:50% 0;transition:transform .45s cubic-bezier(.3,1.4,.5,1);
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;
  }
  .tampa::before{content:"";position:absolute;top:-10px;left:35%;right:35%;height:14px;border-radius:5px;background:linear-gradient(#5a5f67,#2c2f34)} /* dobradiça */
  .tampa span{font-size:10px;letter-spacing:.18em;font-weight:700;color:rgba(255,255,255,.85);background:rgba(0,0,0,.35);padding:3px 8px;border-radius:4px}
  .base.aberta .tampa{transform:rotateX(-112deg)}
  .base.aberta .tampa span{opacity:0}

  .dica{font-size:12px;color:var(--muted);letter-spacing:.06em;text-align:center;min-height:16px}
  .dica.erro{color:var(--red-hi)}.dica.ok{color:var(--green-hi)}
  .rodape{text-align:center;color:#555a62;font-size:11px;letter-spacing:.08em}
  @media (prefers-reduced-motion:reduce){.tampa{transition:none}.led.off i{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/icons/icon-painel-180.png" alt="">
    <div><h1>Painel de Sistemas</h1><p class="sub">Levante a tampa e aperte para trocar o estado</p></div>
  </header>

  <div class="senha">
    <label for="senha">Senha</label>
    <input id="senha" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
  </div>

  <div id="lista" style="display:flex;flex-direction:column;gap:18px"></div>
  <p class="rodape">ATUALIZA A CADA 15 SEGUNDOS</p>
</div>

<script>
const BASE = 'https://mapa-a4630-default-rtdb.firebaseio.com/controle';
const PROJETOS = [
  { id: 'mapa',   nome: 'Mapa de Territórios',   url: 'mapa-system.vercel.app' },
  { id: 'quadro', nome: 'Quadro de Designações', url: 'quadro-designacoes.vercel.app' },
];
const ICONE_POWER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.2 6.8a8 8 0 1 0 11.6 0"/></svg>';

const senhaEl = document.getElementById('senha');
try { senhaEl.value = localStorage.getItem('painel-senha') || ''; } catch (_) {}
senhaEl.addEventListener('change', () => { try { localStorage.setItem('painel-senha', senhaEl.value); } catch (_) {} });

const estado = {};   // id -> true (fora do ar) | false (no ar) | null
const timers = {};
const lista = document.getElementById('lista');

for (const p of PROJETOS) {
  const caixa = document.createElement('div');
  caixa.className = 'caixa';
  caixa.innerHTML = `
    <i class="parafuso p1"></i><i class="parafuso p2"></i><i class="parafuso p3"></i><i class="parafuso p4"></i>
    <div class="placa">
      <div><div class="nome"></div><div class="url"></div></div>
      <div class="led"><i></i><span>…</span></div>
    </div>
    <div class="base">
      <div class="anel"><button class="botao vermelho" disabled></button></div>
      <div class="tampa" role="button" aria-label="Levantar a tampa"><span>LEVANTE</span></div>
    </div>
    <div class="dica"></div>`;
  caixa.querySelector('.nome').textContent = p.nome;
  caixa.querySelector('.url').textContent = p.url;
  p.el = caixa;
  caixa.querySelector('.tampa').addEventListener('click', () => abrirTampa(p));
  caixa.querySelector('.botao').addEventListener('click', () => apertar(p));
  lista.appendChild(caixa);
}

function dica(p, txt, cls = '') { const d = p.el.querySelector('.dica'); d.textContent = txt; d.className = 'dica ' + cls; }

function pintar(p) {
  const off = estado[p.id];
  const led = p.el.querySelector('.led');
  led.className = 'led ' + (off === true ? 'off' : off === false ? 'on' : '');
  led.querySelector('span').textContent = off === true ? 'Manutenção' : off === false ? 'No ar' : 'Sem sinal';
  const b = p.el.querySelector('.botao');
  b.className = 'botao ' + (off ? 'verde' : 'vermelho');
  b.innerHTML = ICONE_POWER + (off ? 'RELIGAR' : 'DESLIGAR');
  b.disabled = off == null || !p.el.querySelector('.base').classList.contains('aberta');
}

function abrirTampa(p) {
  if (estado[p.id] == null) return;
  const base = p.el.querySelector('.base');
  base.classList.add('aberta');
  pintar(p);
  dica(p, estado[p.id] ? 'Aperte para colocar no ar' : 'Aperte para tirar do ar');
  clearTimeout(timers[p.id]);
  timers[p.id] = setTimeout(() => fecharTampa(p), 7000);
}
function fecharTampa(p) {
  clearTimeout(timers[p.id]);
  p.el.querySelector('.base').classList.remove('aberta');
  pintar(p);
}

async function apertar(p) {
  const base = p.el.querySelector('.base');
  if (!base.classList.contains('aberta')) return;
  clearTimeout(timers[p.id]);
  const senha = senhaEl.value.trim();
  if (!senha) { fecharTampa(p); dica(p, 'Digite a senha primeiro', 'erro'); senhaEl.focus(); return; }
  const novoOff = !estado[p.id];
  const b = p.el.querySelector('.botao');
  b.classList.add('apertado'); b.disabled = true;
  dica(p, 'Enviando…');
  try {
    const r = await fetch(`${BASE}/${p.id}.json`, {
      method: 'PUT', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ off: novoOff, em: Date.now(), senha }),
    });
    if (!r.ok) throw new Error(r.status === 401 ? 'Senha incorreta' : 'Não foi possível salvar');
    try { localStorage.setItem('painel-senha', senha); } catch (_) {}
    estado[p.id] = novoOff;
    if (navigator.vibrate) navigator.vibrate(60);
    dica(p, novoOff ? 'Fora do ar. Tela de manutenção ativa.' : 'No ar novamente.', 'ok');
  } catch (e) {
    dica(p, e.message === 'Senha incorreta' ? 'Senha incorreta' : 'Sem conexão. Tente de novo.', 'erro');
  }
  setTimeout(() => { b.classList.remove('apertado'); fecharTampa(p); }, 350);
}

async function carregar() {
  await Promise.all(PROJETOS.map(async p => {
    try {
      const r = await fetch(`${BASE}/${p.id}/off.json`, { cache: 'no-store' });
      estado[p.id] = (await r.json()) === true;
    } catch (_) { estado[p.id] = null; }
    if (!p.el.querySelector('.base').classList.contains('aberta')) pintar(p);
  }));
}

PROJETOS.forEach(pintar);
carregar();
setInterval(carregar, 15000);
</script>
</body>
</html>
