<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Histórico de Visitas</title>
<link rel="icon" type="image/png" href="C.png">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<style>
  :root {
    --bg:         #dde2e8;
    --card-bg:    #ffffff;
    --border:     #f1f5f9;
    --text-1:     #1e293b;
    --text-2:     #64748b;
    --text-3:     #94a3b8;
    --accent:     #3b82f6;
    --row-hover:  #f8fafc;
    --reset-bg:     #fef2f2;
    --reset-border: #fca5a5;
    --reset-color:  #dc2626;
  }
  [data-theme="dark"] {
    --bg:         #0d1520;
    --card-bg:    #1a2535;
    --border:     #2d3f55;
    --text-1:     #e2eaf4;
    --text-2:     #8da4be;
    --text-3:     #4e6782;
    --accent:     #60a5fa;
    --row-hover:  #1e2d40;
    --reset-bg:     rgba(220,38,38,.15);
    --reset-border: rgba(220,38,38,.4);
    --reset-color:  #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text-1);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh; padding: 24px 16px 60px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  h1 { font-size: 1.3rem; }
  .summary { font-size: 0.85rem; color: var(--text-2); }
  .card {
    background: var(--card-bg); border-radius: 14px;
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
    overflow: hidden; margin-bottom: 16px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-3); font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: .04em; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }
  td.quadras-marcadas, th.quadras-marcadas { white-space: normal; min-width: 220px; }
  .block-tag {
    display: inline-block; background: var(--row-hover); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 7px; font-size: 0.75rem; margin: 1px 3px 1px 0; color: var(--text-2);
  }
  .count-badge {
    display: inline-block; background: var(--accent); color: #fff;
    border-radius: 999px; padding: 2px 9px; font-size: 0.75rem; font-weight: 700;
  }
  .empty, .loading { text-align: center; padding: 40px 20px; color: var(--text-2); font-size: 0.9rem; }
  .table-scroll { overflow-x: auto; }
  .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #btn-reset-map {
    padding: 7px 14px; font-size: 0.78rem; font-weight: 600; white-space: nowrap;
    color: var(--reset-color); background: var(--reset-bg);
    border: 1.5px solid var(--reset-border); border-radius: 8px;
    cursor: pointer; transition: all .15s;
  }
  #btn-reset-map:hover { background: var(--reset-color); color: #fff; border-color: var(--reset-color); }
  #btn-reset-map:disabled { opacity: .6; cursor: default; }
  @media (max-width: 640px) {
    th, td { padding: 9px 10px; font-size: 0.78rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📋 Histórico de Visitas</h1>
    <div class="header-right">
      <div class="summary" id="summary">Carregando…</div>
      <button id="btn-reset-map">↺ Resetar mapa</button>
    </div>
  </header>

  <div class="card">
    <div class="table-scroll">
      <table id="log-table" style="display:none">
        <thead>
          <tr>
            <th>Data da visita</th>
            <th>Nome</th>
            <th>Qtd</th>
            <th class="quadras-marcadas">Quadras marcadas</th>
            <th>Confirmado em</th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
      <div class="loading" id="loading">Carregando histórico…</div>
      <div class="empty" id="empty" style="display:none">Nenhuma visita registrada ainda.</div>
    </div>
  </div>
</div>

<script>
// Mesmo projeto Firebase usado pelo mapa (index.html)
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAtb-LNOVPIoUu2lTCvD-UC7wsuIysFVeY",
  authDomain: "mapa-a4630.firebaseapp.com",
  databaseURL: "https://mapa-a4630-default-rtdb.firebaseio.com",
  projectId: "mapa-a4630",
  storageBucket: "mapa-a4630.firebasestorage.app",
  messagingSenderId: "4497521251",
  appId: "1:4497521251:web:ed3da5b33d73f98cc79656"
};

const LOG_STORE   = 'mapa-visitas-v1';    // fallback local, mesmo nome usado no index.html
const STATE_STORE = 'mapa-territorios-v1'; // idem, para o estado (quadras marcadas)

// Modo escuro automático pela preferência do sistema
if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.setAttribute('data-theme', 'dark');
}

function fmtDate(isoDate) {
  if (!isoDate) return '—';
  const [y, m, d] = isoDate.split('-');
  return `${d}/${m}/${y}`;
}
function fmtTimestamp(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(records) {
  const table   = document.getElementById('log-table');
  const body    = document.getElementById('log-body');
  const loading = document.getElementById('loading');
  const empty   = document.getElementById('empty');
  const summary = document.getElementById('summary');
  loading.style.display = 'none';

  if (!records.length) {
    empty.style.display = 'block';
    table.style.display = 'none';
    summary.textContent = 'Nenhum registro';
    return;
  }

  records.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

  const totalQuadras = records.reduce((s, r) => s + (r.totalQuadras || (r.quadras ? r.quadras.length : 0)), 0);
  summary.textContent = `${records.length} confirmação${records.length > 1 ? 'ões' : ''} · ${totalQuadras} quadra${totalQuadras !== 1 ? 's' : ''} no total`;

  body.innerHTML = records.map(r => {
    const n = r.totalQuadras || (r.quadras ? r.quadras.length : 0);
    // quadraLabels (ex: "19A") é o formato novo; cai pros ids brutos em
    // registros antigos que não tinham esse campo salvo ainda.
    const codes = r.quadraLabels || r.quadras || [];
    const blockTags = codes.length
      ? codes.map(code => `<span class="block-tag">${escHtml(code)}</span>`).join('')
      : '—';
    return `
      <tr>
        <td>${fmtDate(r.data)}</td>
        <td>${escHtml(r.nome) || '—'}</td>
        <td><span class="count-badge">${n}</span></td>
        <td class="quadras-marcadas">${blockTags}</td>
        <td>${fmtTimestamp(r.timestamp)}</td>
      </tr>
    `;
  }).join('');

  table.style.display = 'table';
}

// Reseta o mapa (limpa as quadras marcadas), preservando nomes de território.
// Não afeta o histórico de visitas acima — são caminhos separados no banco.
document.getElementById('btn-reset-map').addEventListener('click', async () => {
  if (!confirm('Resetar o mapa? Todas as quadras voltarão a ter cor.')) return;
  const btn  = document.getElementById('btn-reset-map');
  const orig = btn.textContent;
  btn.disabled    = true;
  btn.textContent = 'Resetando...';
  try {
    if (FIREBASE_CONFIG) {
      const estadoRef = firebase.database().ref('estado');
      const snap = await estadoRef.once('value');
      const cur  = snap.val() || {};
      await estadoRef.set({ visited: {}, names: cur.names || {} });
    } else {
      try {
        const raw = localStorage.getItem(STATE_STORE);
        const cur = raw ? JSON.parse(raw) : {};
        localStorage.setItem(STATE_STORE, JSON.stringify({ visited: {}, names: cur.names || {} }));
      } catch (_) {}
    }
  } catch (e) {
    console.error(e);
    alert('Não foi possível resetar o mapa.');
  } finally {
    btn.disabled    = false;
    btn.textContent = orig;
  }
});

function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem(LOG_STORE);
    render(raw ? JSON.parse(raw) : []);
  } catch (_) {
    render([]);
  }
}

if (FIREBASE_CONFIG) {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    const ref = firebase.database().ref('visitas');
    ref.on('value', snap => {
      const val = snap.val() || {};
      render(Object.values(val));
    }, err => {
      console.error(err);
      loadFromLocalStorage();
    });
  } catch (e) {
    console.error(e);
    loadFromLocalStorage();
  }
} else {
  loadFromLocalStorage();
}
</script>
</body>
</html>
